name: Docker Build

on: push

jobs:
  build:
    if: ${{ ! (startsWith(github.event.head_commit.message, 'chore') || startsWith(github.event.head_commit.message, 'docs')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Release branch check
        id: release
        run: |
          echo $GITHUB_REF_NAME | grep -Pq '^\d+\.\d+(?:\.\d+)?$' && echo 'matches=true' || echo 'matches=false' >> $GITHUB_OUTPUT

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: latest=false
          images: boolivar/comdb2
          tags: |
            type=raw,value=8.1
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref_name == 'master' || steps.release.outputs.matches }}
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
